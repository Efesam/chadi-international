server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Standard hardening headers. helmet() on the API server only protects
    # /api responses - this is what actually protects the HTML/JS the
    # browser loads for real visitors.
    #
    # connect-src includes a wildcard HTTPS fallback because the API can run
    # on a different origin depending on deployment (VITE_API_URL) - if you
    # know your production API origin, replace that with it explicitly for a
    # tighter policy.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.paystack.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-src https://checkout.paystack.com https://standard.paystack.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    # Browsers only ever honor this over an actual HTTPS connection, so it's
    # inert (harmless) while this container is only reachable over plain
    # HTTP, and takes effect automatically once TLS is added in front of it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client-side routing (React Router) - fall back to index.html for any
    # path that isn't a real static file, instead of nginx's default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself is never cached so
    # deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
