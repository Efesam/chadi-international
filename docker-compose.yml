services:
  api:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    volumes:
      - server_data:/app/data
      - server_uploads:/app/uploads
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_PAYSTACK_PUBLIC_KEY: ${VITE_PAYSTACK_PUBLIC_KEY:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  server_data:
  server_uploads:
