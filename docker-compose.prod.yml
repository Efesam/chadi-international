# Production overlay - adds Caddy in front of both services for automatic
# HTTPS (Let's Encrypt) and single-domain routing (see ./Caddyfile), instead
# of exposing api/client directly on the host the way docker-compose.override.yml
# does for local dev.
#
# Usage on the VPS:
#   SITE_DOMAIN=your-real-domain.org docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Passing an explicit -f list like this is what excludes
# docker-compose.override.yml - Compose only auto-merges it when no -f flags
# are given at all.
services:
  api:
    restart: always

  client:
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your real domain, e.g. chadi-international.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - client
    restart: always

volumes:
  caddy_data:
  caddy_config:
