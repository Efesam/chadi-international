# Auto-loaded by `docker compose up` alongside docker-compose.yml (no -f
# flag needed) - exposes both services directly on the host for local
# production-parity testing, exactly as before. Production deploys use
# docker-compose.prod.yml instead (see README > Deployment), which
# explicitly does NOT include this file, since Caddy fronts everything
# there instead of exposing these ports directly.
services:
  api:
    ports:
      - "4000:4000"

  client:
    ports:
      - "8080:80"
